name: "FOKU$ WAVE — five-year M15 BID/ASK research (one-off)"
on:
  workflow_dispatch:
  # The first merge of this workflow to main launches one reproducible
  # research attempt. Future code pushes do NOT re-download five years.
  push:
    branches: [main]
    paths:
      - .github/workflows/wave-five-year.yml

permissions:
  contents: read

concurrency:
  group: fokus-wave-five-year-research
  cancel-in-progress: false

jobs:
  wave-five-year:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - name: Install pinned research dependencies
        run: python -m pip install -r requirements-worker.txt
      - name: Download five years original M15 BID + ASK from Dukascopy
        run: bash scripts/download_wave_m15.sh DANE_SP500_WAVE_M15
      - name: Audit and pair 10 original files (no gap filling)
        run: |
          python -m scripts.prepare_wave_m15 \
            --folder DANE_SP500_WAVE_M15 \
            --out FOKUS_WAVE_M15_5_LAT_BID_ASK.csv
      - name: Research A–E and build full year-by-year results
        run: |
          PYTHONPATH=. python -m scripts.run_wave_5year \
            --csv FOKUS_WAVE_M15_5_LAT_BID_ASK.csv \
            --out WAVE_5Y_RESULTS --rr 1.5 --hold 120 --slippage 0.25
      - name: Upload exact source and original research tables
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FOKUS-WAVE-M15-2021-2026-BID-ASK-RESEARCH
          path: |
            FOKUS_WAVE_M15_5_LAT_BID_ASK.csv
            FOKUS_WAVE_M15_5_LAT_BID_ASK.audit.json
            WAVE_5Y_RESULTS/
          retention-days: 30
          if-no-files-found: error
