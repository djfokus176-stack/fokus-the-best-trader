name: FOKU$ PAPER v4 - scheduled DEMO scan (optional)
on:
  # GitHub schedules are best-effort and may be delayed or skipped.
  # Offset from minute 0 reduces peak congestion.
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fokus-paper-v4-one-writer
  cancel-in-progress: false
jobs:
  paper:
    # Skip before allocating a runner unless owner enables the bot.
    # Avoid consuming Actions minutes for unconfigured 5-min cron.
    if: vars.FOKUS_PAPER_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FOKUS_PAPER_WORKER_ENABLED: ${{ vars.FOKUS_PAPER_WORKER_ENABLED }}
      FOKUS_CANDLE_TIME_CONFIRMED: ${{ vars.FOKUS_CANDLE_TIME_CONFIRMED }}
      FOKUS_SUPABASE_URL: ${{ secrets.FOKUS_SUPABASE_URL }}
      FOKUS_SUPABASE_SECRET_KEY: ${{ secrets.FOKUS_SUPABASE_SECRET_KEY }}
      CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
      CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
      CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      CAPITAL_EPIC: ${{ vars.CAPITAL_EPIC || 'US500' }}
      # Optional strategy comparison; AUTO remains default until opted in.
      FOKUS_PAPER_STRATEGY: ${{ vars.FOKUS_PAPER_STRATEGY || 'AUTO — 6 STRATEGII' }}
      # Owner opted in 8 Nov 2026. Paid API calls ONLY if worker OpenAI secret exists.
      # Existing GitHub variables set explicitly to 'false' still disable GPT.
      # Limited calls are NOT hard monetary spending caps.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FOKUS_AUTO_AI_ENABLED: ${{ vars.FOKUS_AUTO_AI_ENABLED || 'true' }}
      FOKUS_AUTO_AI_MODEL: ${{ vars.FOKUS_AUTO_AI_MODEL || 'gpt-5.4-mini' }}
      FOKUS_AUTO_AI_DAILY_LIMIT: ${{ vars.FOKUS_AUTO_AI_DAILY_LIMIT || '6' }}
      FOKUS_AUTO_AI_MONTHLY_LIMIT: ${{ vars.FOKUS_AUTO_AI_MONTHLY_LIMIT || '60' }}
      FOKUS_AUTO_AI_INCLUDE_WAIT: ${{ vars.FOKUS_AUTO_AI_INCLUDE_WAIT || 'true' }}
      # Opt-in only: default fixed targets until PAPER policy comparisons validate.
      FOKUS_PAPER_EXIT_POLICY: ${{ vars.FOKUS_PAPER_EXIT_POLICY || 'fixed' }}
    steps:
      - name: Verify explicit opt-in and required secrets (no output of secret values)
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [[ "$FOKUS_PAPER_WORKER_ENABLED" != "true" ]]; then
            echo "PAPER worker disabled. Repository variable FOKUS_PAPER_WORKER_ENABLED must be true."
            exit 0
          fi
          for key in FOKUS_SUPABASE_URL FOKUS_SUPABASE_SECRET_KEY CAPITAL_API_KEY CAPITAL_IDENTIFIER CAPITAL_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required server secret: $key. No market calls performed."
              exit 0
            fi
          done
          if [[ "${FOKUS_AUTO_AI_ENABLED:-false}" == "true" ]]; then
            if [[ -n "${OPENAI_API_KEY:-}" ]]; then
              echo "AUTO_GPT=READY; capped attempts per day=$FOKUS_AUTO_AI_DAILY_LIMIT per month=$FOKUS_AUTO_AI_MONTHLY_LIMIT; billable API."
            else
              echo "AUTO_GPT=NOT_READY; GitHub Actions OPENAI_API_KEY secret missing (no paid API request)."
            fi
          else
            echo "AUTO_GPT=DISABLED; GitHub variable FOKUS_AUTO_AI_ENABLED=false."
          fi
          echo "OFFICIAL_MACRO=FED/BEA automatic hourly watch (BLS veto independent)."
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-python@v6
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-worker.txt
      - name: Install pinned dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install -r requirements-worker.txt
      - name: Scan Capital DEMO once; checkpoint is mandatory
        if: steps.preflight.outputs.ready == 'true'
        run: python -m trader.worker --once --tf MINUTE
        # Strategy is resolved from FOKUS_PAPER_STRATEGY by worker argparse.
        # The old hard-coded --strategy silently ignored that setting.
      - name: Audit durable PAPER event cycle (read-only, aggregate only)
        if: steps.preflight.outputs.ready == 'true'
        run: python -m trader.paper_proof
        # A green job does not mean any positions opened. Inspect
        # OBSERVED_COMPLETE_PAPER_CYCLE vs NOT_PROVEN in the job log.
