name: FOKUS THE BEST TRADER - tests + Streamlit boot
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pip freeze | grep -E '^(streamlit|pandas|numpy|plotly|requests|openai)=='
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall -q trader app.py healthcheck.py tests
